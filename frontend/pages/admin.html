<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW Admin Paneli</title>
    <link rel="icon" href="../assets/images/BMW Logo.png" type="image/x-icon" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <style>
        body { font-family: "Oswald", sans-serif; }
    </style>
</head>
<body id="admin-panel">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="../index.html"><img width="100" src="../assets/images/website-navbaar-logo.png" alt=""></a>
            <span class="navbar-text text-light ms-3">
                Yönetim Paneli
            </span>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4">Modelleri Yönet</h2>
        
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Model Adı</th>
                        <th>Motor Tipi</th>
                        <th>İşlemler</th>
                    </tr>
                </thead>
                <tbody id="admin-modeller-tbody">
                    <tr>
                        <td colspan="4" class="text-center">Modeller yükleniyor...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/script.js"></script>

</html>
