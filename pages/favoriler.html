<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favorilerim</title>
  <link rel="icon" href="../images/BMW Logo.png" type="image/x-icon" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../style.css" />
</head>
<body style="background-color: #f6f6f6;">
  <nav class="navbar navbar-expand-lg custom-navbar navbar-dark bg-bmw-dark">
    <div class="nav-inner-container">
      <a class="navbar-brand" href="../index.html">
        <img class="bmw-main-logo" src="../images/website-navbaar-logo.png" alt="BMW Logo">
      </a>
    </div>
  </nav>

  <div class="container mt-5 mb-5">
    <h2 class="mb-4" style="font-weight: 300;">Favori Araçlarım</h2>
    <div class="row row-cols-1 row-cols-md-3 g-4" id="favoriGrid">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-secondary" role="status"></div>
      </div>
    </div>
  </div>

  <script>
    // Basit Session ID Yöntemi (Kullanıcı giriş yapmadan çalışır)
    let session_id = localStorage.getItem('bmw_session_id');
    if(!session_id) {
        session_id = 'sess_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('bmw_session_id', session_id);
    }

    function loadFavoriler() {
      fetch('http://localhost:5000/api/favoriler?session_id=' + session_id)
        .then(res => res.json())
        .then(res => {
          const grid = document.getElementById('favoriGrid');
          grid.innerHTML = '';
          if(res.success && res.data.length > 0) {
            res.data.forEach(item => {
              grid.innerHTML += `
                <div class="col">
                  <div class="card h-100 shadow-sm border-0">
                    <img src="${item.resim_yolu}" class="card-img-top" alt="${item.model_adi}">
                    <div class="card-body">
                      <h5 class="card-title">${item.model_adi}</h5>
                      <p class="card-text">${item.yakit_tipi} | ${item.kasa_tipi}</p>
                      <button class="btn btn-outline-danger w-100 mt-2" onclick="removeFavori(${item.fav_id})">
                        <i class="bi bi-trash"></i> Favorilerden Kaldır
                      </button>
                    </div>
                  </div>
                </div>`;
            });
          } else {
             grid.innerHTML = '<div class="col-12"><p class="text-muted">Favori aracınız bulunmuyor.</p></div>';
          }
        });
    }

    function removeFavori(id) {
        fetch('http://localhost:5000/api/favoriler?id=' + id, { method: 'DELETE' })
            .then(res => res.json())
            .then(() => loadFavoriler());
    }

    document.addEventListener("DOMContentLoaded", loadFavoriler);
  </script>
</body>
</html>
